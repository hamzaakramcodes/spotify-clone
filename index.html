<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="utilites.css">
</head>

<body>
    <h1>yes bbbbbbbbbbbbbbbbb </h1>
    <div class="container">
        <div class="left">
            <div class="home">
                <div class="log">
                    <img class="invert" src="img/logo.svg" alt="">
                    <div class="closeBtn">&times;</div>
                </div>
                <ul>
                    <li>
                        <img class="invert" src="img/home.svg" alt="">
                        Home
                    </li>
                    <li>
                        <img class="invert" src="img/search.svg" alt="">
                        Search
                    </li>
                </ul>
            </div>
            <div class="library">
                <div class="header">
                    <img class="invert" src="img/playlist.svg" alt="">
                    <h3>Your Library</h3>
                </div>
                <div class="songsList">
                    <ul>

                    </ul>
                </div>
                <div class="footer">
                    <div><a href="https://www.spotify.com/jp/legal/"><span>Legal</span></a></div>
                    <div><a href="https://www.spotify.com/jp/privacy/"><span>Privacy Center</span></a></div>
                    <div><a href="https://www.spotify.com/jp/legal/privacy-policy/"><span>Privacy Policy</span></a>
                    </div>
                    <div><a href="https://www.spotify.com/jp/legal/cookies-policy/"><span>Cookies</span></a></div>
                    <div><a href="https://www.spotify.com/jp/legal/privacy-policy/#s3"><span>About Ads</span></a></div>
                    <div><a href="https://www.spotify.com/jp/accessibility/"><span>Accessibility</span></a></div>
                </div>
            </div>
        </div>
        <div class="right">
            <div class="header">
                <div class="leftButton invert ">
                    <div class="hamburger invert">&#9776;</div>
                    <img src="img/left.svg" alt="">
                    <img src="img/right.svg" alt="">
                </div>
                <div class="rightButton">
                    <div class="signup">Sign up</div>
                    <div class="login">Log in</div>
                </div>
            </div>
            <div class="songsPlayList">
                <h2>Spotify Playlists</h2>
                <div class="cardContainer">


                    <!-- <div class="space"></div> -->
                </div>

                <div class="playBar">
                    <div class="songDetail">
                        <div id="currentSongName" class="name"></div>
                        <div class="btns">
                            <img id="previous" class="invert" src="img/prevsong.svg" alt="">
                            <img id="play" class="invert" src="img/play.svg" alt="">
                            <img id="next" class="invert" src="img/nextsong.svg" alt="">
                        </div>
                        <div class="volume">
                            <div id="duration"></div>
                            <img class="invert" src="img/volume.svg" alt="">
                            <input type="range" name="" id="">
                        </div>
                    </div>
                    <div class="seekBar">
                        <div class="dot"></div>
                    </div>

                </div>
            </div>

        </div>
        <script src="script.js"></script>
</body>

</html>
